<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Calculator</title>

    <link rel="stylesheet" href="style.css">
    <link type="js" href="index.js">
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>

</head>

<body>

    <div id="calculator">

        <h1 id="heading">Quick Calculator</h1>

        <p id="subtitle">Perform simple calculations</p>


        <label id="label1">First Number</label>

        <input id="firstNumber" type="number" >


        <label id="label2">Second Number</label>

        <input id="secondNumber" type="number">


        <!-- <label id="label3">Third Number</label>

        <input id="thirdNumber" type="number" > -->


        <label id="resultLabel">Result</label>

        <input id="result" type="text" readonly>


        <div id="buttons">

            <button id="add" onclick="addition()">Add</button>

            <button id="subtract" onclick="substractio()">Subtract</button>

            <button id="multiply" onclick="multiplication()">Multiply</button>

            <button id="divide" onclick="divison()">Divide</button>

        </div>

    </div>

</body>

</html>
